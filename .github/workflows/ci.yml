name: AFS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install disposable Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Independent processes against real Redis
        run: go test -tags=integration -timeout=15m -count=1 -v ./tests/e2e
